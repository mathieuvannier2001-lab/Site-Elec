# Configuration de l'hébergement Netlify
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Fichiers versionnés (CSS/JS générés, police) : mis en cache un an par les navigateurs.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# En-têtes de sécurité pour toutes les pages.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Prévient Bing (IndexNow) des pages nouvelles ou modifiées après chaque mise en ligne.
[[plugins]]
  package = "/netlify/plugins/indexnow"

# Adresse courte pour demander un avis : amcf-electricien.fr/avis
# (302 pour pouvoir changer la destination plus tard sans cache).
[[redirects]]
  from = "/avis"
  to = "https://g.page/r/CWJzlxYXp70nEBM/review"
  status = 302
  force = true

[[redirects]]
  from = "/avis/"
  to = "https://g.page/r/CWJzlxYXp70nEBM/review"
  status = 302
  force = true
